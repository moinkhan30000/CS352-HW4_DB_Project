<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Register</h1>

    {% if message %}
        <div class="flash">{{ message }}</div>
    {% endif %}

    <form action="{{ url_for('register') }}" method="post">
        <div class="form-group">
            <label for="username">Full Name:</label>
            <input type="text" id="username" name="username" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="password">Student ID (Password):</label>
            <input type="text" id="password" name="password" placeholder="Enter student ID" required>
        </div>

        <div class="form-group">
            <label for="bdate">Birthdate:</label>
            <input type="date" id="bdate" name="bdate" required>
        </div>

        <div class="form-group">
            <label for="dept">Department:</label>
            <select id="dept" name="dept" required>
                <option value="">Select Department</option>
                <option value="CS">Computer Science (CS)</option>
                <option value="EE">Electrical Engineering (EE)</option>
                <option value="IE">Industrial Engineering (IE)</option>
                <option value="ME">Mechanical Engineering (ME)</option>
                <option value="CE">Civil Engineering (CE)</option>
                <option value="BIO">Biology (BIO)</option>
                <option value="PH">Physics (PH)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="year">Year (1-4):</label>
            <input type="number" id="year" name="year" min="1" max="4" required>
        </div>

        <div class="form-group">
            <label for="gpa">GPA (0.0 - 4.0):</label>
            <input type="number" id="gpa" name="gpa" min="0" max="4" step="0.01" required>
        </div>

        <button type="submit">Register</button>
    </form>

    <form action="{{ url_for('login') }}" method="get">
        <button type="submit">Back to Login</button>
    </form>

    <!-- Dynamic birthdate limits -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var today = new Date();
        var minYear = today.getFullYear() - 100;
        var maxYear = today.getFullYear() - 16;

        var minDate = new Date(minYear, 0, 1);
        var maxDate = new Date(maxYear, 11, 31);

        var bdateInput = document.getElementById('bdate');
        bdateInput.min = minDate.toISOString().split('T')[0];
        bdateInput.max = maxDate.toISOString().split('T')[0];

        var defaultYear = today.getFullYear() - 18;
        var defaultDate = new Date(defaultYear, 0, 1);
        bdateInput.value = defaultDate.toISOString().split('T')[0];
    });
    </script>

</body>
</html>
